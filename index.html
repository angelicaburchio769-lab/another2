                                data: {
                                    description: childValue.description || '',
                                    details: childValue.details || '',
                                    children: childValue.children || {}
                                }
                            });
                            linksData.push({ source: id, target: childId });

                            Object.keys(childValue.children || {}).forEach(grandChild => {
                                const grandChildId = nodeId++;
                                const grandChildKey = `${childKey}-${grandChild}`;
                                nodeMap[grandChildKey] = grandChildId;
                                nodesData.push({
                                    id: grandChildId,
                                    name: grandChild,
                                    level: 4,
                                    symbolSize: 28,
                                    itemStyle: { color: '#10b981' },
                                    data: { description: childValue.children[grandChild] }
                                });
                                linksData.push({ source: childId, target: grandChildId });
                            });
                        } else {
                            nodesData.push({
                                id: childId,
                                name: child,
                                level: 3,
                                symbolSize: 35,
                                itemStyle: { color: '#0ea5e9' },
                                data: { description: childValue }
                            });
                            linksData.push({ source: id, target: childId });
                        }
                    });
                } else {
                    nodesData.push({
                        id: id,
                        name: subNode,
                        level: 2,
                        symbolSize: 45,
                        itemStyle: { color: '#f97316' },
                        data: { description: subNodeValue }
                    });
                    linksData.push({ source: parentId, target: id });
                }
            });
        });

        function layoutTree() {
            const width = document.getElementById('chart').offsetWidth;
            const height = document.getElementById('chart').offsetHeight;
            const centerX = width / 2;
            const centerY = height / 2;

            nodesData.forEach(node => {
                const level = node.level;
                if (level === 0) {
                    node.x = centerX;
                    node.y = centerY;
                } else if (level === 1) {
                    const index = nodesData.filter(n => n.level === 1).indexOf(node);
                    const angle = (index * Math.PI * 2) / 4 - Math.PI / 2;
                    const radius = 200;
                    node.x = centerX + Math.cos(angle) * radius;
                    node.y = centerY + Math.sin(angle) * radius;
                } else if (level === 2) {
                    const parentIndex = nodesData.find(n => n.id === linksData.find(l => l.target === node.id).source);
                    const siblings = nodesData.filter(n => {
                        const link = linksData.find(l => l.target === n.id);
                        return link && link.source === parentIndex.id && n.level === 2;
                    });
                    const siblingIndex = siblings.indexOf(node);
                    const parentNode = nodesData.find(n => n.id === linksData.find(l => l.target === node.id).source);
                    const angleOffset = (siblingIndex - (siblings.length - 1) / 2) * 0.4;
                    const radius = 150;
                    const baseAngle = Math.atan2(parentNode.y - centerY, parentNode.x - centerX);
                    node.x = parentNode.x + Math.cos(baseAngle + angleOffset) * radius;
                    node.y = parentNode.y + Math.sin(baseAngle + angleOffset) * radius;
                } else if (level === 3) {
                    const parentNode = nodesData.find(n => n.id === linksData.find(l => l.target === node.id).source);
                    const siblings = nodesData.filter(n => {
                        const link = linksData.find(l => l.target === n.id);
                        return link && link.source === parentNode.id && n.level === 3;
                    });
                    const siblingIndex = siblings.indexOf(node);
                    const angleOffset = (siblingIndex - (siblings.length - 1) / 2) * 0.35;
                    const radius = 100;
                    const baseAngle = Math.atan2(parentNode.y - centerY, parentNode.x - centerX);
                    node.x = parentNode.x + Math.cos(baseAngle + angleOffset) * radius;
                    node.y = parentNode.y + Math.sin(baseAngle + angleOffset) * radius;
                } else if (level === 4) {
                    const parentNode = nodesData.find(n => n.id === linksData.find(l => l.target === node.id).source);
                    const siblings = nodesData.filter(n => {
                        const link = linksData.find(l => l.target === n.id);
                        return link && link.source === parentNode.id && n.level === 4;
                    });
                    const siblingIndex = siblings.indexOf(node);
                    const angleOffset = (siblingIndex - (siblings.length - 1) / 2) * 0.3;
                    const radius = 70;
                    const baseAngle = Math.atan2(parentNode.y - centerY, parentNode.x - centerX);
                    node.x = parentNode.x + Math.cos(baseAngle + angleOffset) * radius;
                    node.y = parentNode.y + Math.sin(baseAngle + angleOffset) * radius;
                }
            });
        }

        layoutTree();

        let selectedNodeId = null;
        let isAnimating = true;

        const chart = echarts.init(document.getElementById('chart'));
        
        function updateChart() {
            const option = {
                title: {
                    text: '松阳县非遗文化知识图谱',
                    left: 'center',
                    top: 20,
                    textStyle: { color: '#333', fontSize: 18, fontWeight: 'bold' }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.data) {
                            return params.data.name;
                        }
                        return params.name;
                    }
                },
                series: [{
                    type: 'graph',
                    layout: isAnimating ? 'force' : 'none',
                    force: isAnimating ? {
                        repulsion: 200,
                        gravity: 0.05,
                        edgeLength: [100, 250],
                        layoutAnimation: true,
                        friction: 0.6
                    } : null,
                    coordinateSystem: null,
                    roam: true,
                    draggable: false,
                    data: nodesData.map(node => ({
                        ...node,
                        x: node.x,
                        y: node.y,
                        itemStyle: {
                            ...node.itemStyle,
                            shadowBlur: node.id === selectedNodeId ? 30 : 10,
                            shadowColor: node.id === selectedNodeId ? node.itemStyle.color : 'rgba(0,0,0,0.2)',
                            borderWidth: node.id === selectedNodeId ? 4 : 2,
                            borderColor: node.id === selectedNodeId ? '#fff' : '#fff'
                        },
                        label: {
                            show: true,
                            formatter: node.name,
                            fontSize: node.id === selectedNodeId ? 14 : 11,
                            fontWeight: 'bold',
                            color: node.id === selectedNodeId ? '#333' : '#666'
                        },
                        emphasis: {
                            scale: true,
                            scaleSize: 10,
                            label: { show: true, fontSize: 14 },
                            itemStyle: {
                                borderWidth: 4,
                                shadowBlur: 30,
                                shadowColor: node.itemStyle.color
                            }
                        }
                    })),
                    links: linksData,
                    lineStyle: {
                        color: '#ccc',
                        width: 1,
                        opacity: 0.6,
                        curveness: 0.1
                    }
                }]
            };
            chart.setOption(option, true);
        }

        updateChart();

        setTimeout(() => {
            isAnimating = false;
            const option = chart.getOption();
            if (option.series && option.series[0] && option.series[0].data) {
                option.series[0].data.forEach((item, idx) => {
                    if (item.x !== undefined && item.y !== undefined) {
                        nodesData[idx].x = item.x;
                        nodesData[idx].y = item.y;
                    }
                });
            }
            updateChart();
        }, 5000);

        function focusNode(nodeId) {
            selectedNodeId = nodeId;
            const node = nodesData.find(n => n.id === nodeId);
            if (node) {
                chart.dispatchAction({
                    type: 'focusNodeAdjacency',
                    seriesIndex: 0,
                    dataIndex: nodesData.indexOf(node)
                });
                setTimeout(() => {
                    chart.dispatchAction({
                        type: 'showTip',
                        seriesIndex: 0,
                        dataIndex: nodesData.indexOf(node)
                    });
                }, 100);
                updateChart();
            }
        }

        let historyStack = [];

        chart.on('click', function(params) {
            if (params.data) {
                selectedNodeId = params.data.id;
                focusNode(params.data.id);
                historyStack.push(params.data);
                displayInfo(params.data);
            }
        });

        function buildBreadcrumb(node) {
            const path = [];
            let current = node;
            while (current) {
                path.unshift(current);
                const link = linksData.find(l => l.target === current.id);
                current = link ? nodesData.find(n => n.id === link.source) : null;
            }
            return `
                <div class="breadcrumb">
                    ${path.map((item, idx) => `
                        <span class="${idx === path.length - 1 ? '' : 'breadcrumb-item'}" 
                              ${idx !== path.length - 1 ? `onclick="goToNode(${item.id}, event)"` : ''}>
                            ${item.name}
                        </span>
                        ${idx < path.length - 1 ? ' › ' : ''}
                    `).join('')}
                </div>
            `;
        }

        function displayInfo(node) {
            const infoPanel = document.getElementById('info-panel');
            let html = '';

            if (historyStack.length > 1) {
                html += `<button class="back-btn" onclick="goBack()">← 回到上一级</button>`;
            }

            html += buildBreadcrumb(node);

            if (node.level === 0) {
                html += `
                    <div class="card">
                        <div class="card-title">🏮 ${node.name}</div>
                        <div class="card-content">${node.data.description}</div>
                        <div class="sub-nodes">
                            <strong>📚 非遗项目：</strong>
                            ${Object.keys(node.data.subNodes).map((sub, idx) => `
                                <div class="sub-node-item" onclick="jumpToNode('${rootName}-${sub}', event)">
                                    <span>${idx + 1}. ${sub}</span>
                                    <span class="nav-arrow">→</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (node.level === 1) {
                html += `
                    <div class="card">
                        <div class="card-title">📘 ${node.name}</div>
                        <div class="card-content">${node.data.description}</div>
                        <div class="details">
                            <strong style="color: #667eea;">📄 详细信息：</strong>
                            <div class="detail-text">${node.data.details}</div>
                        </div>
                        <div class="sub-nodes">
                            <strong>🔍 子项目：</strong>
                            ${Object.keys(node.data.children).map((child, idx) => `
                                <div class="sub-node-item" onclick="jumpToNode('${rootName}-${node.name}-${child}', event)">
                                    <span>${idx + 1}. ${child}</span>
                                    <span class="nav-arrow">→</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (node.level === 2) {
                html += `
                    <div class="card">
                        <div class="card-title">📄 ${node.name}</div>
                        <div class="details">
                            <div class="detail-text">${node.data.description || ''}</div>
                        </div>
                        ${node.data.details ? `
                            <div class="details">
                                <strong style="color: #667eea;">📄 详细信息：</strong>
                                <div class="detail-text">${node.data.details}</div>
                            </div>
                        ` : ''}
                        ${node.data.children && Object.keys(node.data.children).length ? `
                            <div class="sub-nodes">
                                <strong>🔍 细分节点：</strong>
                                ${Object.keys(node.data.children).map((child, idx) => {
                                    const parentKey = linksData.find(l => l.target === node.id).source;
                                    const parentNode = nodesData.find(n => n.id === parentKey);
                                    return `<div class="sub-node-item" onclick="jumpToNode('${rootName}-${parentNode.name}-${node.name}-${child}', event)">
                                        <span>${idx + 1}. ${child}</span>
                                        <span class="nav-arrow">→</span>
                                    </div>`;
                                }).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (node.level === 3) {
                html += `
                    <div class="card">
                        <div class="card-title">🔹 ${node.name}</div>
                        <div class="details">
                            <div class="detail-text">${node.data.description || ''}</div>
                        </div>
                        ${node.data.details ? `
                            <div class="details">
                                <strong style="color: #667eea;">📄 详细信息：</strong>
                                <div class="detail-text">${node.data.details}</div>
                            </div>
                        ` : ''}
                        ${node.data.children && Object.keys(node.data.children).length ? `
                            <div class="sub-nodes">
                                <strong>🔍 细分节点：</strong>
                                ${Object.keys(node.data.children).map((child, idx) => {
                                    const parentKey = linksData.find(l => l.target === node.id).source;
                                    const parentNode = nodesData.find(n => n.id === parentKey);
                                    const grandParentKey = linksData.find(l => l.target === parentNode.id).source;
                                    const grandParentNode = nodesData.find(n => n.id === grandParentKey);
                                    return `<div class="sub-node-item" onclick="jumpToNode('${rootName}-${grandParentNode.name}-${parentNode.name}-${node.name}-${child}', event)">
                                        <span>${idx + 1}. ${child}</span>
                                        <span class="nav-arrow">→</span>
                                    </div>`;
                                }).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            } else if (node.level === 4) {
                html += `
                    <div class="card">
                        <div class="card-title">📍 ${node.name}</div>
                        <div class="details">
                            <div class="detail-text">${node.data.description || ''}</div>
                        </div>
                    </div>
                `;
            }

            infoPanel.innerHTML = html;
        }

        window.goBack = function() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prevNode = historyStack[historyStack.length - 1];
                focusNode(prevNode.id);
                displayInfo(prevNode);
            }
        };

        window.goToNode = function(nodeId, event) {
            if (event) event.stopPropagation();
            const node = nodesData.find(n => n.id === nodeId);
            if (node) {
                historyStack = [];
                focusNode(node.id);
                displayInfo(node);
            }
        };

        window.jumpToNode = function(key, event) {
            event.stopPropagation();
            const nodeId = nodeMap[key];
            if (nodeId !== undefined) {
                const node = nodesData.find(n => n.id === nodeId);
                if (node) {
                    historyStack.push(node);
                    focusNode(nodeId);
                    displayInfo(node);
                }
            }
        };

        window.addEventListener('resize', () => {
            layoutTree();
            chart.resize();
            updateChart();
        });
    </script>
</body>
</html>
